name: Build TrollStore IPA (iOS 16)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_native:
        description: Ignore the cached native libraries
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}

env:
  MADEIRA_IOS_MIN: '16.0'

permissions:
  contents: write

jobs:
  compile-check:
    # Swift/ObjC compile errors without waiting hours for the native job; the
    # link step fails here by design (no native libraries).
    name: Compile check (no link)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
      - name: FEX generated headers only
        run: |
          brew install ccache || true
          cmake -S FEX -B FEX/build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_DEPLOYMENT_TARGET=$MADEIRA_IOS_MIN \
            -DCMAKE_BUILD_TYPE=Release -DTUNE_CPU=none -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DENABLE_FEX_ALLOCATOR=OFF -DENABLE_ASSERTIONS=OFF > fex-configure.log 2>&1 \
            || { tail -40 fex-configure.log; exit 0; }
          cmake --build FEX/build-ios --target IR_INC CONFIG_INC || true
      - name: Compile
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime   # Microsoft's runtime is not redistributed here
          set +e
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO ENABLE_DEBUG_DYLIB=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build > xcodebuild.log 2>&1
          echo "xcodebuild exit $?"
          grep -E "error:" xcodebuild.log | sort -u | head -400
          echo "== link/other =="; grep -E "^ld: |Undefined symbols|\*\* BUILD" xcodebuild.log | head -20
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: compile-check-log
          path: xcodebuild.log
          retention-days: 5

  native:
    name: Native libraries (Wine, FEX, FFmpeg, GnuTLS)
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache key
        id: key
        run: |
          subs=$(git submodule status --recursive | awk '{print $1 $2}' | shasum -a 256 | cut -c1-16)
          echo "key=native-v2-${MADEIRA_IOS_MIN}-${subs}-${{ hashFiles('build/**', 'ci/build-native.sh', 'ci/patches/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore native libraries
        id: cache
        if: ${{ !inputs.rebuild_native }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: native-libs.tar.zst

      - name: Select Xcode
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Host tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install bison flex ninja meson ccache zstd coreutils llvm || true

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-native.sh freetype gnutls ffmpeg wine pe64 ntdll wineserver win32u fex rppairing verify

      - name: Pack
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          files=(app/Madeira/lib*.a app/Madeira/legal/LICENSES-rppairing-crates.txt FEX/build-ios app/Madeira/arm64ec-windows/comctl32_v6.dll)
          tar --exclude='*.o' --exclude='CMakeFiles' -cf - "${files[@]}" | zstd -T0 -19 -o native-libs.tar.zst
          ls -lh native-libs.tar.zst

      - name: Save native libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: native-libs.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: native-libs.tar.zst
          retention-days: 7

  dxmt:
    name: DXMT + LLVM for iOS
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache key
        id: key
        run: |
          subs=$(git submodule status dxmt | awk '{print $1}')
          echo "key=dxmt-v2-${MADEIRA_IOS_MIN}-${subs}-${{ hashFiles('build/dxmt-ios/**', 'build/madeira-d3d12/**', 'madeira-d3d12/**', 'ci/build-native.sh', 'ci/patches/dxmt/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore DXMT
        id: cache
        if: ${{ !inputs.rebuild_native }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: app/Madeira/libdxmt_combined.a

      - name: Select Xcode
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Host tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install ninja || true

      - name: LLVM for iOS (restore)
        if: steps.cache.outputs.cache-hit != 'true'
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          key: llvm-ios-8dfdcc7b7-${{ env.MADEIRA_IOS_MIN }}-v1
          path: |
            toolchains/llvm-ios-build
            toolchains/llvm-project/llvm/include

      - name: LLVM for iOS (build)
        if: steps.cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: ci/build-native.sh llvm

      - name: LLVM for iOS (save)
        if: steps.cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: llvm-ios-8dfdcc7b7-${{ env.MADEIRA_IOS_MIN }}-v1
          path: |
            toolchains/llvm-ios-build
            toolchains/llvm-project/llvm/include

      - name: DXMT
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-native.sh dxmt

      - name: Save DXMT
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: app/Madeira/libdxmt_combined.a

      - uses: actions/upload-artifact@v4
        with:
          name: dxmt-lib
          path: app/Madeira/libdxmt_combined.a
          retention-days: 7

  wine-i386:
    # 32-bit programs (WoW64): the i386 Windows farm, app/Madeira/i386-windows.
    name: i386 Windows farm (WoW64)
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache key
        id: key
        run: |
          subs=$(git submodule status wine dxmt | awk '{print $1}' | tr '\n' '-')
          echo "key=i386-v1-${subs}-${{ hashFiles('build/wine-i386/**', 'ci/build-native.sh', 'ci/patches/wine/**', 'ci/patches/dxmt/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore i386 farm
        id: cache
        if: ${{ !inputs.rebuild_native }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: i386-windows.tar.zst

      - name: Select Xcode
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Host tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install bison flex ninja meson zstd || true

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-native.sh i386

      - name: Pack
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tar -cf - app/Madeira/i386-windows | zstd -T0 -19 -o i386-windows.tar.zst
          ls -lh i386-windows.tar.zst

      - name: Save i386 farm
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: i386-windows.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: i386-windows
          path: i386-windows.tar.zst
          retention-days: 7

  app:
    name: Madeira.app → .tipa
    needs: [native, dxmt, wine-i386]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: native-libs

      - uses: actions/download-artifact@v4
        with:
          name: dxmt-lib
          path: app/Madeira

      - uses: actions/download-artifact@v4
        with:
          name: i386-windows

      - name: Unpack the i386 farm (32-bit programs)
        run: |
          command -v zstd >/dev/null || brew install zstd
          zstd -d -c i386-windows.tar.zst | tar -xf -
          ls app/Madeira/i386-windows | wc -l
          test -f app/Madeira/i386-windows/ntdll.dll

      - name: Unpack native libraries
        run: |
          brew install zstd ldid || true
          zstd -d -c native-libs.tar.zst | tar -xf -
          ls -l app/Madeira/*.a

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Build and package
        run: ci/build-app.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: out/xcodebuild.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-trollstore-tipa
          path: out/*.tipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.tipa --title "Madeira $GITHUB_REF_NAME (TrollStore, iOS 16)" \
            --notes "Install the .tipa with TrollStore, then open Madeira with **Open with JIT** (long-press in TrollStore's app list) or tap Enable JIT in Madeira." \
            || gh release upload "$GITHUB_REF_NAME" out/*.tipa --clobber
